name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UK morning press windows: 07:00, 09:00, 12:00, 17:00 Europe/London.
    # GitHub Actions cron is always UTC; the build env sets TZ: Europe/London
    # so Hugo's publishDate comparisons read in UK time. DST drift is acceptable
    # for a 4-times-daily schedule.
    - cron: "0 7,9,12,17 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Embargo guard — fail on future-dated press outside _incoming/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, pathlib, re, sys
          now = datetime.datetime.now(datetime.timezone.utc)
          root = pathlib.Path("content/press")
          violations = []
          for md in root.rglob("*.md"):
              if "_incoming" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              m = re.search(r"^publishDate:\s*(\S+)", text, re.MULTILINE)
              if not m:
                  continue
              try:
                  pd = datetime.datetime.fromisoformat(m.group(1).replace("Z", "+00:00"))
              except ValueError:
                  continue
              if pd.tzinfo is None:
                  pd = pd.replace(tzinfo=datetime.timezone.utc)
              if pd > now:
                  violations.append(f"{md}: publishDate {pd.isoformat()} is in the future")
          if violations:
              print("Embargo guard failed:", file=sys.stderr)
              for v in violations: print("  " + v, file=sys.stderr)
              sys.exit(1)
          print("Embargo guard: no future-dated press files outside _incoming/.")
          PY
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/London
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://www.cingparty.uk/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
