name: Deploy Hugo site to GitHub Pages

# Embargo workflow:
#   - Drafts live in content/press/_incoming/ (cascade build.render: never).
#   - The "Embargo guard" step below fails the build if any file outside
#     _incoming/ has a future publishDate (prevents direct-to-main bypass).
#   - The schedule: trigger fires four times daily so post-dated press
#     publishes when its publishDate passes, without a human commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UK morning press windows: 07:00, 09:00, 12:00, 17:00 Europe/London.
    # GitHub Actions cron is always UTC; the build env sets TZ: Europe/London
    # so Hugo's publishDate comparisons read in UK time. DST drift is acceptable
    # for a 4-times-daily schedule.
    - cron: "0 7,9,12,17 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.1
      TAILWIND_VERSION: 4.2.4
      TAILWIND_SHA256: cabeef049cdeab61a5fa6b65ea28a3e8e53b8a85e58883947868c730fc48bdec
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Cache Hugo resources
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('assets/**') }}
          restore-keys: |
            hugo-${{ runner.os }}-
      - name: Install Tailwind CLI (standalone v4 — no Node, no package.json)
        run: |
          set -euo pipefail
          # Pinned version + checksum from RESEARCH.md §04-01. Bump quarterly per docs/MAINTENANCE.md.
          curl -fsSL -o tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          echo "${TAILWIND_SHA256}  tailwindcss" | sha256sum -c -
          chmod +x tailwindcss
          sudo mv tailwindcss /usr/local/bin/
      - name: Compile Tailwind CSS
        run: |
          set -euo pipefail
          tailwindcss -i assets/css/main.css -o assets/css/compiled.css --minify
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Preview-token guard — validate preview_token / preview_lift / uniqueness
        run: |
          set -euo pipefail
          python3 scripts/preview_guard.py

      - name: Embargo guard — fail on future-dated press outside _incoming/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, pathlib, re, sys
          now = datetime.datetime.now(datetime.timezone.utc)
          root = pathlib.Path("content/press")
          violations = []
          for md in root.rglob("*.md"):
              if "_incoming" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              m = re.search(r"^publishDate:\s*(\S+)", text, re.MULTILINE)
              if not m:
                  continue
              try:
                  pd = datetime.datetime.fromisoformat(m.group(1).replace("Z", "+00:00"))
              except ValueError:
                  continue
              if pd.tzinfo is None:
                  pd = pd.replace(tzinfo=datetime.timezone.utc)
              if pd > now:
                  violations.append(f"{md}: publishDate {pd.isoformat()} is in the future")
          if violations:
              print("Embargo guard failed:", file=sys.stderr)
              for v in violations: print("  " + v, file=sys.stderr)
              sys.exit(1)
          print("Embargo guard: no future-dated press files outside _incoming/.")
          PY
      - name: Validate councillors.yaml schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, pathlib
          import jsonschema
          import yaml   # both installed via scripts/requirements.txt in the previous step

          schema_path = pathlib.Path("schemas/councillors.schema.json")
          data_path   = pathlib.Path("data/councillors.yaml")

          with schema_path.open() as f:
              schema = json.load(f)
          with data_path.open() as f:
              data = yaml.safe_load(f)

          validator = jsonschema.Draft7Validator(schema)
          errors = sorted(validator.iter_errors(data), key=lambda e: list(e.path))

          if not errors:
              print(f"Schema valid: {data_path}")
              sys.exit(0)

          print(f"Schema validation FAILED: {data_path}", file=sys.stderr)
          for err in errors:
              path = " -> ".join(str(p) for p in err.absolute_path) or "(root)"
              print(f"  [{path}] {err.message}", file=sys.stderr)
          sys.exit(1)
          PY
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/London
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://www.cingparty.uk/"

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link check (internal only — lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir ./public
            --cache
            --max-cache-age 1d
            --include-fragments
            --index-files index.html
            --no-progress
            ./public
          fail: true

      - name: Setup Node (a11y job only — ephemeral CI tool, not a project dep)
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install pa11y-ci and http-server (no package.json introduced)
        run: |
          set -euo pipefail
          npm install --no-save pa11y-ci@^4.1.0 http-server@^14

      - name: Run pa11y-ci against built site
        run: |
          set -euo pipefail
          # Serve the built site on localhost:8080 in the background so pa11y/Puppeteer
          # gets a real HTTP origin (file:// URLs choke on CSS/JS resolution).
          npx http-server ./public -p 8080 --silent &
          SERVER_PID=$!
          # Wait up to 10 seconds for the server to be ready.
          for i in $(seq 1 20); do
            if curl -fsSL http://localhost:8080/ > /dev/null 2>&1; then break; fi
            sleep 0.5
          done
          # Run pa11y-ci against the 5 canonical URLs (.pa11yci.json) — zero-error budget.
          set +e
          npx pa11y-ci --config .pa11yci.json
          PA11Y_EXIT=$?
          set -e
          # Always stop the server, even on a11y failure.
          kill $SERVER_PID 2>/dev/null || true
          exit $PA11Y_EXIT

      # Embargo previews are additive: a failure here must never block the
      # main site deploy. Run AFTER lychee + pa11y so those checks don't
      # see in-progress draft content under /preview/.
      - name: Build embargo previews
        id: preview_build
        continue-on-error: true
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          PUBLIC_BASE: https://www.cingparty.uk
          TZ: Europe/London
        run: |
          set -euo pipefail
          bash scripts/preview_build.sh

      - name: Write lift-day redirect stubs
        id: lift_redirects
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/lift_redirects.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    # Pages allows only one concurrent deploy. Scope the lock to this job
    # (not the whole workflow) so PR builds don't fight each other for the
    # same group. cancel-in-progress: false so a queued schedule-driven
    # deploy isn't dropped by a fresh push to main.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
